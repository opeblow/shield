<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check with Shield</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d2925">
  <style>
    :root { color-scheme: light; --ink: #0d2925; --paper: #f7f8f4; --brand: #0d2925; --muted: #5b6b66; --card: #ffffff; --ring: #c2d3cd; --danger: #9b1c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: grid; place-items: center; }
    .card { background: var(--card); border: 1px solid var(--ring); border-radius: 20px; padding: 2rem; max-width: 460px; width: calc(100% - 2rem); box-shadow: 0 8px 30px rgba(13, 41, 37, 0.08); }
    .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.15rem; margin: 0 0 1.1rem; }
    .brand img { width: 34px; height: 34px; }
    h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; line-height: 1.5; }
    .quote { font-style: italic; color: var(--ink); background: var(--paper); border-left: 3px solid var(--brand); padding: 0.8rem 1rem; border-radius: 8px; margin: 0 0 1.25rem; overflow-wrap: anywhere; }
    button { width: 100%; background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 0.9rem 1rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .muted { color: var(--danger); font-size: 0.9rem; margin-top: 0.9rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/icon.svg" alt=""><span>Shield</span></div>
    <h1>Check before you trust it</h1>
    <p>We'll scan the text you received and tell you if it looks like a scam before you send money or share a code.</p>
    <blockquote class="quote" id="quote"></blockquote>
    <button id="check" disabled>Opening Shield…</button>
    <p class="muted hidden" id="error"></p>
  </main>
  <script src="/share.js"></script>
</body>
</html>

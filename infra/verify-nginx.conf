upstream api_backend {
  server api:3001;
  server api-2:3001;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /healthz { proxy_pass http://api_backend/healthz; }
  location /readyz { proxy_pass http://api_backend/readyz; }
  location = /openapi.yaml { proxy_pass http://api_backend/openapi.yaml; }
  location /v1/ { proxy_pass http://api_backend; }
  location /c/ { proxy_pass http://api_backend; }
  location = /docs { proxy_pass http://api_backend/docs; }
  location = /integrations { proxy_pass http://api_backend/integrations; }
  location = /auth { proxy_pass http://api_backend/auth; }
  location = /app { proxy_pass http://api_backend/app; }
  location = /share { proxy_pass http://api_backend/share; }
  location = /recovery { proxy_pass http://api_backend/recovery; }
  location / { try_files $uri $uri/ /index.html; }
}

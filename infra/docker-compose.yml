services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shield
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/0000_roles.sql:/docker-entrypoint-initdb.d/0000_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d shield"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      DATABASE_URL_MIGRATOR: postgres://shield:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/shield
    depends_on:
      postgres: { condition: service_healthy }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d2925">
    <meta name="description" content="Sign in or create a Shield account to check suspicious messages.">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="mask-icon" href="/icon.svg" color="#0d2925">
    <link rel="stylesheet" href="/styles.css">
    <title>Sign in — Shield</title>
  </head>
  <body class="auth-body">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Shield home"><span class="brand-mark" aria-hidden="true">S</span><span>shield<span class="brand-dot">.</span></span></a>
      <a class="back-link" href="/">Back to home</a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <img class="auth-logo" src="/icon.svg" alt="Shield logo" width="64" height="64">
        <p class="eyebrow" id="auth-eyebrow">Welcome</p>
        <h1 id="auth-title">Create your account</h1>
        <p class="auth-sub" id="auth-sub">Save your checks and return any time. No card required.</p>
        <div class="auth-tabs" role="tablist" aria-label="Sign in or create account">
          <button class="auth-tab" type="button" role="tab" data-mode="signup" aria-selected="false">Create account</button>
          <button class="auth-tab" type="button" role="tab" data-mode="signin" aria-selected="false">Sign in</button>
        </div>
        <form id="auth-form" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
          <button id="auth-submit" class="scan-button" type="submit"><span id="auth-submit-label">Create account</span><span aria-hidden="true">→</span></button>
          <p id="auth-status" class="qr-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-fineprint">Use Shield only for legitimate checks. Never enter your PIN, password, or a one-time code into a message you are checking.</p>
      </section>
    </main>
    <script type="module" src="/auth.js"></script>
  </body>
</html>

openapi: 3.1.0
info:
  title: Shield Fraud-Defence API
  version: 0.1.0
  description: >
    Fraud-defence API for Nigerian consumer bank transfers. Scan text, URLs,
    QR payloads, phones and accounts; verify official bank/telco channels;
    read and report community reputation; assess transfers with a policy
    engine; issue verifiable check cards; stream deep scans; and subscribe to
    webhook events. All customer-facing identifiers are blinded before storage.
    Mix-and-match authentication: session cookies for the web app, integration
    keys (X-Api-Key) for bank servers, bearer keys for tenant/moderation ops.
servers:
  - url: https://api.shield.example
    description: Production
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Auth
  - name: Scans
  - name: Assess
  - name: Lookup
  - name: Reports
  - name: Reputation
  - name: Directory
  - name: Certificates
  - name: Integrations
  - name: Webhooks
  - name: Usage
  - name: Voice
  - name: Ops
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Ops]
      security: []
      summary: Liveness probe
      responses:
        "200": { description: Process is alive, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      tags: [Ops]
      security: []
      summary: Readiness probe
      responses:
        "200": { description: Ready to serve traffic, content: { application/json: { schema: { $ref: "#/components/schemas/Ready" } } } }
        "503": { description: A dependency is unavailable }
  /v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an email/password account
      description: Passwords are stored as scrypt hashes. A successful sign-up sets an HttpOnly session cookie. Returns 409 when the email is already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email already registered }
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in to an existing account
      description: Verifies the password and sets a fresh session cookie. Returns 401 for unknown email or wrong password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Incorrect email or password }
  /v1/auth/me:
    get:
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: Return the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: Revoke the current session and clear the cookie
      responses:
        "204": { description: Session revoked }
  /v1/billing/plans:
    get:
      tags: [Billing]
      summary: List Shield's published metered rates
      responses:
        "200": { description: Public pricing and metering definitions }
  /v1/billing/usage:
    get:
      tags: [Billing]
      security:
        - bearerAuth: []
      summary: Calculate a trailing 30-day usage estimate
      description: Requires the tenant API key scope billing:read. Estimates are not invoices; Shield does not collect payment yet.
      responses:
        "200": { description: Tenant-scoped usage lines and estimated total in minor currency units }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/auth/sessions:
    get:
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: List active sessions for the signed-in account
      responses:
        "200": { description: Active sessions; current session is identified without exposing session tokens }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: Revoke every other session for the signed-in account
      responses:
        "204": { description: Other sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/scans:
    post:
      tags: [Scans]
      summary: Scan text or combined inputs
      description: Runs the rule engine and returns a verdict. `mode: deep` runs the fast pass first and returns `upgrade_url` for the deep stream.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Scan verdict
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScanResult"
                  - type: object
                    properties:
                      upgrade_url: { type: string, description: SSE endpoint for the deep pass }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "429": { description: Rate limited }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/scans/{id}/stream:
    get:
      tags: [Scans]
      summary: Stream scan progress (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Text event stream with `fast`, `deep` and `final` events
          content:
            text/event-stream:
              schema: { type: string }
        "404": { description: Unknown scan stream }
  /v1/assess:
    post:
      tags: [Assess]
      summary: Assess a transfer against a risk policy
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessRequest" }
      responses:
        "200":
          description: Assessment with action, score and customer message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/lookup:
    post:
      tags: [Lookup]
      summary: Look up community reports for an identifier
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [account, phone, url] }
                value: { type: string }
      responses:
        "200":
          description: Aggregated report summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResult" }
  /v1/reports:
    post:
      tags: [Reports]
      summary: Submit a community scam report
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201": { description: Report accepted for moderation }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/usage:
    get:
      tags: [Usage]
      summary: Current tenant usage and quota
      responses:
        "200":
          description: Usage counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, description: Must be HTTPS }
                events:
                  type: array
                  items: { type: string, enum: [scan.completed, assess.completed, fraud_wave.detected] }
      responses:
        "201":
          description: Webhook created; the signing secret is shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  secret: { type: string }
                  events: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not found }
  /v1/reputation/reports:
    post:
      tags: [Reputation]
      security:
        - cookieAuth: []
      summary: Report an identifier for moderation
      description: >
        Submits a phone, account or URL report. Reports stay pending until a
        moderator verifies or rejects them; only verified reports weight shared
        reputation. Identifiers are blind-indexed, never stored in the clear.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "202":
          description: Report accepted for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
                  identifier: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Sign in to report }
  /v1/reputation/lookup:
    post:
      tags: [Reputation]
      security:
        - cookieAuth: []
      summary: Look up reputation for an identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [account, phone, url] }
                value: { type: string }
      responses:
        "200":
          description: Reputation summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationSummary" }
        "401": { description: Sign in to look up }
        "404": { description: No reputation for this identifier }
  /v1/reputation/reports/{id}/decide:
    post:
      tags: [Reputation]
      summary: Verify or reject a pending report (moderator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [verify, reject] }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id: { type: string, format: uuid }
                  status: { type: string, enum: [verified, rejected] }
        "401": { description: Moderator key required }
        "409": { description: Report is no longer pending }
  /v1/certificates:
    post:
      tags: [Certificates]
      security:
        - cookieAuth: []
      summary: Issue a verifiable check card for a scan
      description: >
        Seals the stored verdict, score, scam types and redacted message of a
        scan you ran while signed in into an HMAC-signed token that
        independently verifies for 7 days. The verdict is taken from the
        server-side scan record, never from the request, so a card can never
        claim a scam message is safe. Scans expire after 48 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRequest" }
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateIssued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Sign in to issue a check }
        "403": { description: The scan was run by a different signed-in user }
        "404": { description: Scan not found or older than 48 hours }
  /v1/certificates/{token}:
    get:
      tags: [Certificates]
      security:
        - cookieAuth: []
      summary: Verify a check card
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sealed payload verifies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificatePayload" }
        "400": { description: Invalid, tampered, or expired token }
  /v1/integrations/scan:
    post:
      tags: [Integrations]
      security:
        - apiKey: []
      summary: Scan a message with an integration key
      description: Identity-scoped scan; requires the scans:write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 5000 }
                language: { $ref: "#/components/schemas/Language" }
      responses:
        "200":
          description: Scan verdict plus shield context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScanResult"
                  - type: object
                    properties:
                      shield: { $ref: "#/components/schemas/Shield" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Key lacks the scans:write scope }
  /v1/integrations/verify-channel:
    post:
      tags: [Directory]
      security:
        - apiKey: []
      summary: Check whether a phone or URL is an official bank or telco channel
      requires: directory:read scope on the key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [phone, url] }
                value: { type: string }
      responses:
        "200":
          description: Channel verdict with optional reputation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Key lacks the directory:read scope }
  /v1/integrations/lookup:
    post:
      tags: [Integrations]
      security:
        - apiKey: []
      summary: Read reputation for an identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [account, phone, url] }
                value: { type: string }
      responses:
        "200":
          description: Reputation summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Key lacks the lookup:read scope }
        "404": { description: No reputation for this identifier }
  /v1/integrations/certificates/{token}:
    get:
      tags: [Certificates]
      security:
        - apiKey: []
      summary: Verify a check card with an integration key
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sealed payload verifies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificatePayload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { description: Invalid, tampered, or expired token }
  /v1/integration/keys:
    post:
      tags: [Integrations]
      security:
        - cookieAuth: []
      summary: Create an integration key (developer dashboard)
      description: The raw key is returned exactly once; store it server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationKeyCreate" }
      responses:
        "201":
          description: Key created; key shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: array, items: { type: string } }
                  key: { type: string }
                  created_at: { type: string, format: date-time }
                  note: { type: string }
        "401": { description: Sign in to manage keys }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Integrations]
      security:
        - cookieAuth: []
      summary: List active integration keys
      responses:
        "200":
          description: Keys (hash previews only, never the raw key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/IntegrationKey" }
        "401": { description: Sign in to manage keys }
  /v1/integration/keys/{id}:
    delete:
      tags: [Integrations]
      security:
        - cookieAuth: []
      summary: Revoke an integration key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "401": { description: Sign in to manage keys }
        "404": { description: No active key with that id }
  /v1/voice/speak:
    post:
      tags: [Voice]
      summary: Synthesize a warning in a Tier 1 language
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, language]
              properties:
                text: { type: string, maxLength: 500 }
                language: { $ref: "#/components/schemas/Language" }
      responses:
        "200":
          description: Base64 audio and the provider used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Speech" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: Rate limited }
  /v1/voice/providers:
    get:
      tags: [Voice]
      security: []
      summary: List speech providers and the default synthesis backend
      responses:
        "200":
          description: Provider names and the default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeechProviders" }
  /v1/link-preview:
    post:
      tags: [Scans]
      security: []
      summary: Previews a URL through the SSRF-safe fetcher without executing anything
      description: >
        Fetches a public http(s) URL with a bounded body, returns status, size,
        HTML title/meta description, and the URL's scam signals. Never runs
        page scripts or loads subresources. Private/loopback hosts are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkPreviewRequest" }
      responses:
        "200":
          description: A bounded preview of the fetched page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: Unsafe URL (non-public host)" content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: Rate limited }
  /v1/batch/scan:
    post:
      tags: [Scans]
      security: []
      summary: Scans 1 to 25 messages in one call
      description: >
        Accepts anonymous or integration-key (scans:write) callers; each item
        is scanned with the same rule + reputation engine as /v1/scans and
        returned with its shield context. No stream or persist step.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchScanRequest" }
      responses:
        "200":
          description: One result per item, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchScanResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: No session and the integration key is missing or lacks scans:write }
        "429": { description: Rate limited }
  /v1/alerts/waves:
    get:
      tags: [Reports]
      summary: Recent fraud-wave alerts from verified-report surges
      description: >
        Active and resolved waves detected when moderators verify several
        reports for the same identifier inside 30 minutes. Requires a session.
      responses:
        "200":
          description: Waves seen in the last 48 hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WavesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/ops/readiness:
    get:
      tags: [Ops]
      summary: Launch-readiness audit of every subsystem
      description: >
        Evaluates persistence, rate limiting, auth, speech, certificates,
        blind-index pepper and TLS posture; returns a ready/degraded status
        with actionable recommendations. Requires a session.
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/session:
    get:
      tags: [Auth]
      security: []
      summary: Returns the signed-in user or 401
      description: Lightweight session check used by share-target pages to decide whether to forward to /app.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/media/scan:
    post:
      tags: [Scans]
      security: []
      summary: Validates an uploaded image, document, or audio artifact
      description: >
        Accepts raw bytes with the artifact's media type as Content-Type. Sniffs
        magic bytes to confirm the true type, rejects SVG/executables and
        mismatched declared types, and enforces per-kind size limits. Never
        executes or renders the artifact.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/bmp: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
          audio/ogg: { schema: { type: string, format: binary } }
          audio/mpeg: { schema: { type: string, format: binary } }
          audio/wav: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Artifact accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaScanResult" }
        "413": { description: Payload exceeds the 8 MiB upload ceiling }
        "415": { description: Unsupported, mismatched, or executable content }
        "429": { description: Rate limited }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: Tenant API key }
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Integration key minted in the developer dashboard (scopes-scoped)
    cookieAuth: { type: apiKey, in: cookie, name: shield_session, description: HttpOnly session cookie set by /v1/auth/register and /v1/auth/login }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMedia:
      description: Content-Type must be application/json
    Unavailable:
      description: A required dependency is unavailable
  schemas:
    Language: { type: string, enum: [en, pcm, yo, ha, ig] }
    AuthUser:
      type: object
      properties:
        user:
          type: object
          properties:
            email: { type: string, format: email }
    Health: { type: object, properties: { status: { type: string } } }
    Ready:
      type: object
      properties:
        status: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, error, skipped] }
    Problem:
      type: object
      properties:
        error: { type: string }
        detail: { type: string }
    ScanInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, url, qr, phone, account, image, document, audio, video] }
        text: { type: string }
        value: { type: string }
        payload: { type: string }
        bank: { type: string }
        number: { type: string }
        content_base64: { type: string }
    ScanRequest:
      type: object
      properties:
        text: { type: string, maxLength: 5000 }
        inputs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ScanInput" }
        language: { $ref: "#/components/schemas/Language" }
        mode: { type: string, enum: [fast, deep], default: fast }
    ScanResult:
      type: object
      required: [scan_id, verdict, risk_score, confidence, input_types]
      properties:
        scan_id: { type: string, format: uuid }
        verdict: { type: string, enum: [safe, caution, likely_scam, scam] }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: number }
        scam_types: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: object } }
        input_types: { type: array, items: { type: string } }
        customer_message: { type: object }
        model_version: { type: string }
        latency_ms: { type: number }
    AssessRequest:
      type: object
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string }
        beneficiary: { type: string }
        beneficiaryAccount: { type: string }
        accountAgeDays: { type: integer, minimum: 0 }
        payeeNovel: { type: boolean }
        channel: { type: string, enum: [app, ussd, atm, web, agent] }
        hourOfDay: { type: integer, minimum: 0, maximum: 23 }
        customerScans: { type: integer, minimum: 0 }
        message: { type: string }
        language: { $ref: "#/components/schemas/Language" }
        policy: { type: object, description: Development-only policy override; production rejects client-supplied policy }
    Assessment:
      type: object
      required: [action, risk_score]
      properties:
        action: { type: string, enum: [allow, warn, review, delay, block] }
        risk_score: { type: integer }
        confidence: { type: number }
        reasons: { type: array, items: { type: object } }
        customer_message: { type: object }
    LookupResult:
      type: object
      properties:
        type: { type: string }
        reports: { type: integer }
        verifiedReports: { type: integer }
        score: { type: integer }
        lastSeen: { type: [string, "null"] }
    ReportRequest:
      type: object
      required: [type, value, scamType]
      properties:
        type: { type: string, enum: [account, phone, url] }
        value: { type: string }
        scamType: { type: string }
        evidence: { type: string }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
    Usage:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        usage:
          type: array
          items:
            type: object
            properties:
              metric: { type: string }
              quantity: { type: integer }
        quota:
          type: object
          properties:
            plan: { type: string }
            monthly_scans: { type: integer }
    Speech:
      type: object
      properties:
        language: { $ref: "#/components/schemas/Language" }
        mime_type: { type: string }
        audio_base64: { type: string }
        provider: { type: string, description: Backend used (e.g. simulated, openai) }
    SpeechProviders:
      type: object
      properties:
        providers: { type: array, items: { type: string } }
        default: { type: string }
    LinkPreviewRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: Public http(s) URL to preview }
    LinkPreview:
      type: object
      properties:
        url: { type: string, description: Final URL after redirects }
        status: { type: integer }
        content_type: { type: string }
        bytes: { type: integer }
        truncated: { type: boolean }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        signals:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              text: { type: string }
              evidence: { type: string }
    BatchScanRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            required: [text]
            properties:
              text: { type: string, minLength: 2, maxLength: 20000 }
              language: { $ref: "#/components/schemas/Language" }
    BatchScanResponse:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              verdict: { type: string }
              risk_score: { type: integer }
              reasons: { type: array, items: { type: string } }
              shield: { $ref: "#/components/schemas/Shield" }
    MediaScanResult:
      type: object
      properties:
        accepted: { type: boolean }
        kind: { type: string, enum: [image, document, audio] }
        bytes: { type: integer }
        analysis:
          type: object
          properties:
            scanned: { type: boolean }
            note: { type: string }
    WaveAlert:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [account, phone, url] }
        label: { type: string, description: Display-safe identifier label (after blinding) }
        count: { type: integer, description: Verified reports inside the 30-minute window }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        status: { type: string, enum: [active, resolved] }
    WavesResponse:
      type: object
      properties:
        waves: { type: array, items: { $ref: "#/components/schemas/WaveAlert" } }
    ReadinessReport:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded] }
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
        recommendations: { type: array, items: { type: string } }
    ReputationSummary:
      type: object
      required: [kind, reports, verified, pending]
      properties:
        kind: { type: string, enum: [account, phone, url] }
        value: { type: string }
        reports: { type: integer }
        verified: { type: integer, description: Moderator-verified reports; only these weight verdicts }
        pending: { type: integer }
        first_seen: { type: [string, "null"], format: date-time }
        last_seen: { type: [string, "null"], format: date-time }
    DirectoryCheck:
      type: object
      properties:
        value: { type: string }
        status: { type: string, enum: [verified, not_found] }
        name: { type: [string, "null"] }
        shortName: { type: [string, "null"] }
    Shield:
      type: object
      properties:
        reputation:
          type: array
          items: { $ref: "#/components/schemas/ReputationSummary" }
        official_channels:
          type: array
          items: { $ref: "#/components/schemas/DirectoryCheck" }
    ChannelVerification:
      type: object
      properties:
        value: { type: string }
        official: { type: string, enum: [verified, not_found] }
        channel:
          type: [object, "null"]
          properties:
            id: { type: string }
            kind: { type: string, enum: [bank, telco] }
            name: { type: string }
            shortName: { type: string }
        reputation: { $ref: "#/components/schemas/ReputationSummary" }
    CertificateRequest:
      type: object
      required: [scan_id]
      properties:
        scan_id:
          type: string
          format: uuid
          description: The scan_id of a scan you completed while signed in.
        note: { type: string, maxLength: 300 }
    CertificateIssued:
      type: object
      properties:
        certificate_id: { type: string, format: uuid }
        card_url: { type: string }
        verify_url: { type: string }
        verified_until: { type: string, format: date-time }
    CertificatePayload:
      type: object
      required: [certificate_id, verdict, risk_score, message, checked_at, expires_at, issuer]
      properties:
        certificate_id: { type: string, format: uuid }
        scan_id: { type: string, format: uuid }
        verdict: { type: string, enum: [safe, caution, likely_scam, scam] }
        risk_score: { type: integer }
        scam_types: { type: array, items: { type: string } }
        message: { type: string }
        checked_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        issuer: { type: string }
        note: { type: string }
    IntegrationKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [scans:write, lookup:read, directory:read, certificates:read] }
    IntegrationKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        key_preview: { type: string, description: Hash preview, never the raw key }
